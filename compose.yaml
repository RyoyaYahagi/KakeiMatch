services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3002}
      DATABASE_PATH: /app/data/kakeimatch.db
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env before starting Compose}
    ports:
      - "127.0.0.1:${PORT:-3002}:3000"
    volumes:
      - app-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bootstrap:
    profiles: ["tools"]
    build:
      context: .
      target: maintenance
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3002}
      DATABASE_PATH: /app/data/kakeimatch.db
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env before starting Compose}
    volumes:
      - app-data:/app/data
    stdin_open: true
    tty: true

volumes:
  app-data:
