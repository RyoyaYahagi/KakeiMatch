services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3002}
      DATABASE_PATH: /app/data/kakeimatch.db
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env before starting Compose}
      ACTUAL_SERVER_URL: ${ACTUAL_SERVER_URL:-http://actual:5006}
      ACTUAL_SERVER_PASSWORD: ${ACTUAL_SERVER_PASSWORD:-}
    ports:
      - "127.0.0.1:${PORT:-3002}:3000"
    volumes:
      - app-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  actual:
    image: actualbudget/actual-server:latest
    restart: unless-stopped
    environment:
      ACTUAL_DATA_DIR: ${ACTUAL_DATA_DIR:-/data}
    ports:
      - "127.0.0.1:${ACTUAL_HOST_PORT:-5006}:5006"
    volumes:
      - actual-data:${ACTUAL_DATA_DIR:-/data}
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  bootstrap:
    profiles: ["tools"]
    build:
      context: .
      target: maintenance
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3002}
      DATABASE_PATH: /app/data/kakeimatch.db
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env before starting Compose}
    volumes:
      - app-data:/app/data
    stdin_open: true
    tty: true

volumes:
  app-data:
  actual-data:
