name: KakeiMatch
options:
  minimumXcodeGenVersion: 2.44.1
  # The app is Japanese-only. Without this the system camera sheet shows
  # English controls such as "Use Photo" because the bundle development
  # region stays en.
  developmentLanguage: ja
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    KM_NATIVE_HOST: kakeimatch.yhgry.workers.dev
    # The iOS OAuth client ID is public information (it is also in the built
    # Info.plist and the URL scheme), so it is kept in source.
    KM_GOOGLE_CLIENT_ID: 828427548675-v5pkal203tj2d9k13k3scv9po4ag7spv.apps.googleusercontent.com
    KM_GOOGLE_URL_SCHEME: com.googleusercontent.apps.828427548675-v5pkal203tj2d9k13k3scv9po4ag7spv
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0
targets:
  KakeiMatch:
    type: application
    platform: iOS
    sources: [KakeiMatch]
    dependencies:
      - sdk: libsqlite3.tbd
      - package: ZIPFoundation
      - package: GoogleSignIn
    entitlements:
      path: KakeiMatch/KakeiMatch.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:$(KM_NATIVE_HOST)
        com.apple.developer.devicecheck.appattest-environment: $(KM_APP_ATTEST_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kakeimatch.ios
        # XcodeGen injects 1,2 for app targets, which overrides the project-level
        # iPhone-only setting and adds UIDeviceFamily [1, 2] to Info.plist.
        # The app is portrait-only iPhone UI, so pin the target explicitly.
        TARGETED_DEVICE_FAMILY: '1'
        DEVELOPMENT_TEAM: $(KM_DEVELOPMENT_TEAM)
        INFOPLIST_KEY_CFBundleDisplayName: KakeiMatch
        INFOPLIST_KEY_NSCameraUsageDescription: レシートや給与明細を撮影して入力に使います。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Only OS-provided encryption (HTTPS, Passkey, App Attest). The owner approved
        # declaring it exempt, so TestFlight builds do not wait for the export question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        Debug:
          KM_APP_ATTEST_ENVIRONMENT: development
        Release:
          KM_APP_ATTEST_ENVIRONMENT: production
    # `INFOPLIST_KEY_` only maps keys Xcode knows, so a custom key would be
    # dropped from the generated Info.plist. Inject it after plist processing;
    # code signing runs after this phase.
    postBuildScripts:
      - name: Inject KMNativeAPIHost
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :KMNativeAPIHost" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :KMNativeAPIHost string ${KM_NATIVE_HOST}" "$plist"
      - name: Inject KMGoogleSignIn
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          # Delete first so a second build in the same derived-data directory can
          # re-add the values instead of failing on an existing key.
          /usr/libexec/PlistBuddy -c "Delete :GIDClientID" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string ${KM_GOOGLE_CLIENT_ID}" "$plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string ${KM_GOOGLE_URL_SCHEME}" "$plist"
  KakeiMatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KakeiMatchTests
        excludes: [Fixtures]
      - path: KakeiMatchTests/Fixtures
        buildPhase: resources
        type: folder
      - path: ../../test/fixtures/ios-parity
        buildPhase: resources
        type: folder
      - path: ../../test/fixtures/muse-snapshot
        buildPhase: resources
        type: folder
    dependencies:
      - target: KakeiMatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kakeimatch.ios.tests
  KakeiMatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KakeiMatchUITests]
    dependencies:
      - target: KakeiMatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kakeimatch.ios.uitests
schemes:
  KakeiMatch:
    build:
      targets:
        KakeiMatch: all
    test:
      gatherCoverageData: true
      targets:
        - KakeiMatchTests
        - KakeiMatchUITests
