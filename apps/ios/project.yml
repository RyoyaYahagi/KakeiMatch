name: KakeiMatch
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    KM_NATIVE_HOST: kakeimatch.yhgry.workers.dev
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  KakeiMatch:
    type: application
    platform: iOS
    sources: [KakeiMatch]
    dependencies:
      - sdk: libsqlite3.tbd
      - package: ZIPFoundation
    entitlements:
      path: KakeiMatch/KakeiMatch.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:$(KM_NATIVE_HOST)
        com.apple.developer.devicecheck.appattest-environment: $(KM_APP_ATTEST_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kakeimatch.ios
        DEVELOPMENT_TEAM: $(KM_DEVELOPMENT_TEAM)
        INFOPLIST_KEY_CFBundleDisplayName: KakeiMatch
        INFOPLIST_KEY_NSCameraUsageDescription: レシートや給与明細を撮影して入力に使います。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      configs:
        Debug:
          KM_APP_ATTEST_ENVIRONMENT: development
        Release:
          KM_APP_ATTEST_ENVIRONMENT: production
    # `INFOPLIST_KEY_` only maps keys Xcode knows, so a custom key would be
    # dropped from the generated Info.plist. Inject it after plist processing;
    # code signing runs after this phase.
    postBuildScripts:
      - name: Inject KMNativeAPIHost
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :KMNativeAPIHost" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :KMNativeAPIHost string ${KM_NATIVE_HOST}" "$plist"
  KakeiMatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KakeiMatchTests
        excludes: [Fixtures]
      - path: KakeiMatchTests/Fixtures
        buildPhase: resources
        type: folder
      - path: ../../test/fixtures/ios-parity
        buildPhase: resources
        type: folder
    dependencies:
      - target: KakeiMatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kakeimatch.ios.tests
  KakeiMatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KakeiMatchUITests]
    dependencies:
      - target: KakeiMatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kakeimatch.ios.uitests
schemes:
  KakeiMatch:
    build:
      targets:
        KakeiMatch: all
    test:
      gatherCoverageData: true
      targets:
        - KakeiMatchTests
        - KakeiMatchUITests
