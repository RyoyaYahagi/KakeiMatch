name: iOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/ios/**'
      - 'test/fixtures/ios-parity/**'
      - 'test/fixtures/muse-snapshot/**'
      - '.github/workflows/ios.yml'
      # Docs and the TestFlight upload script do not affect the app build or tests.
      - '!apps/ios/**/*.md'
      - '!apps/ios/scripts/testflight.sh'
  # Screenshot-only UI tests run here, not on every pull request.
  # Run the workflow manually on a branch to get its reference screenshots.
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'test/fixtures/ios-parity/**'
      - 'test/fixtures/muse-snapshot/**'
      - '.github/workflows/ios.yml'
      # Docs and the TestFlight upload script do not affect the app build or tests.
      - '!apps/ios/**/*.md'
      - '!apps/ios/scripts/testflight.sh'
  workflow_dispatch:
    inputs:
      simulator:
        description: Simulator device used by the iOS build and UI tests
        type: choice
        required: false
        default: iPhone 17
        options:
          - iPhone 17

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name == 'pull_request' && (github.event.pull_request.draft && format('pr-draft-{0}', github.run_id) || format('pr-{0}', github.event.pull_request.number)) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}

env:
  UI_SHARD_COUNT: 4
  UI_SHARD_FLAGS: ${{ github.event_name == 'pull_request' && '--skip-screenshots' || '' }}
  SIMULATOR_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simulator || '' }}

defaults:
  run:
    working-directory: apps/ios
    shell: bash

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history lets the mtime restoration step recover each file's last
          # commit timestamp for incremental DerivedData builds, while keeping HEAD^1
          # for pull-request changed-path checks.
          fetch-depth: 0
      # actions/checkout resets all file mtimes to checkout time, which makes Xcode
      # recompile every file even with a restored DerivedData cache. Restore each
      # tracked file's mtime to its last commit timestamp (and keep PR-changed files
      # at current time so they are always newer than any main cache). Failure is
      # tolerated so a git timestamp hiccup never blocks the build.
      - name: Restore source file mtimes from git history
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import time

          root = subprocess.check_output(["git", "rev-parse", "--show-toplevel"], text=True).strip()
          tracked = set(
              subprocess.check_output(["git", "-C", root, "ls-files", "-z"]).split(b"\x00")[:-1]
          )
          raw = subprocess.check_output(
              ["git", "-C", root, "log", "-m", "--first-parent", "--format=%x00COMMIT:%ct%x00", "-z", "--name-only"]
          )
          mtimes = {}
          cur_ts = None
          for token in raw.split(b"\x00"):
              token = token.lstrip(b"\n")
              if not token:
                  continue
              if token.startswith(b"COMMIT:"):
                  cur_ts = int(token[7:])
              elif cur_ts is not None and token in tracked and token not in mtimes:
                  mtimes[token] = cur_ts
                  if len(mtimes) == len(tracked):
                      break

          restored = 0
          for rel, ts in mtimes.items():
              full = os.path.join(root.encode(), rel)
              if os.path.lexists(full) and not os.path.islink(full):
                  os.utime(full, (ts, ts))
                  restored += 1

          touched_pr = 0
          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
              now = time.time()
              changed = subprocess.check_output(
                  ["git", "-C", root, "diff", "--name-only", "-z", "HEAD^1", "HEAD"]
              ).split(b"\x00")[:-1]
              for rel in changed:
                  full = os.path.join(root.encode(), rel)
                  if os.path.lexists(full) and not os.path.islink(full):
                      os.utime(full, (now, now))
                      touched_pr += 1

          print(f"Restored mtime for {restored}/{len(tracked)} tracked files; touched {touched_pr} PR-changed files.")
          PY
      # Spotlight indexing (mds/mdworker) competes with the build and simulator
      # for CPU on the hosted runner. Nothing in this workflow searches with
      # Spotlight. Failure is tolerated but reported as a warning.
      - name: Disable Spotlight indexing
        continue-on-error: true
        run: |
          echo "::group::Spotlight state before"
          mdutil -s -a || true
          echo "::endgroup::"
          if ! sudo mdutil -a -i off; then
            echo "::warning::sudo mdutil -a -i off failed; Spotlight indexing may still be running"
          fi
          echo "::group::Spotlight state after"
          mdutil -s -a || true
          echo "::endgroup::"
          if mdutil -s / 2>&1 | grep -q "Indexing enabled"; then
            echo "::warning::Spotlight indexing is still enabled on /"
          fi
      # Official image inventory: Xcode_26.2.app, iOS 26.2, iPhone 17.
      # https://github.com/actions/runner-images/blob/3b5e6b447abb7eadff4a19ac472e806b1e063f42/images/macos/macos-26-Readme.md
      # build-for-testing only needs the destination, not a booted device.
      # Booting here competes with the compiler for the runner's CPUs.
      - name: Select Xcode and simulator destination
        run: bash scripts/ci-simulator.sh select
      - name: Compute DerivedData cache key metadata
        id: cache-env
        continue-on-error: true
        run: |
          xcode=$(xcodebuild -version | tr '\n' '-' | sed 's/[^A-Za-z0-9._-]/-/g; s/-*$//')
          macos="$(sw_vers -productVersion)-$(sw_vers -buildVersion)"
          echo "xcode=$xcode" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "Cache metadata: macos=$macos xcode=$xcode"
      # Recovery from a poisoned cache: bump the key prefix (e.g. ios-deriveddata-v1 -> v2)
      # or delete the bad entry with `gh cache list` + `gh cache delete <id>`.
      # Keep hashFiles inputs strictly to tracked files (no Package.resolved glob, because
      # xcodebuild creates untracked Package.resolved files during the build).
      - name: Restore DerivedData cache
        id: deriveddata-cache
        if: steps.cache-env.outputs.xcode != '' && steps.cache-env.outputs.macos != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: apps/ios/DerivedData
          key: ios-deriveddata-v1-${{ runner.os }}-${{ steps.cache-env.outputs.macos }}-${{ steps.cache-env.outputs.xcode }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Package.swift') }}-${{ hashFiles('apps/ios/KakeiMatch/**', 'apps/ios/KakeiMatchTests/**', 'apps/ios/KakeiMatchUITests/**', 'test/fixtures/ios-parity/**', 'test/fixtures/muse-snapshot/**') }}
          restore-keys: |
            ios-deriveddata-v1-${{ runner.os }}-${{ steps.cache-env.outputs.macos }}-${{ steps.cache-env.outputs.xcode }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Package.swift') }}-
      - name: Discard partial DerivedData after cache restore failure
        if: steps.deriveddata-cache.outcome == 'failure'
        continue-on-error: true
        run: rm -rf DerivedData
      - name: Report DerivedData cache restore status
        if: always()
        continue-on-error: true
        run: |
          hit="${{ steps.deriveddata-cache.outputs.cache-hit }}"
          matched="${{ steps.deriveddata-cache.outputs.cache-matched-key }}"
          outcome="${{ steps.deriveddata-cache.outcome }}"
          echo "DerivedData cache outcome=$outcome hit=${hit:-false} matched=${matched:-none}"
          {
            echo "### DerivedData cache"
            echo "- Restore outcome: \`${outcome:-skipped}\`"
            echo "- Exact cache hit: \`${hit:-false}\`"
            echo "- Matched key: \`${matched:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Run macOS core tests without a simulator
        run: swift test --package-path .
      - name: Validate UI shard coverage
        run: |
          node --test scripts/shard-ui-tests.test.mjs
          node --test scripts/visual-regression.test.mjs
          # Pull requests run the UI tests for the changed paths; main and manual runs run all.
          changed=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths.txt"
            cat "$RUNNER_TEMP/changed-paths.txt"
            changed=(--changed "$RUNNER_TEMP/changed-paths.txt")
          fi
          node scripts/shard-ui-tests.mjs "$UI_SHARD_COUNT" ${UI_SHARD_FLAGS:+"$UI_SHARD_FLAGS"} "${changed[@]}" > ui-shards.json
          cat ui-shards.json
          # ui-tests runs one job per matrix entry. A matrix that disagrees with UI_SHARD_COUNT
          # would silently skip the tests of the missing shards, so fail here.
          node <<'JS'
          const fs = require("node:fs");
          const text = fs.readFileSync("../../.github/workflows/ios.yml", "utf8");
          const found = text.match(/^        shard: \[([^\]]*)\]\s*$/m);
          if (!found) throw new Error("ui-tests matrix line not found in .github/workflows/ios.yml");
          const matrix = found[1].split(",").map((value) => Number(value.trim()));
          const count = Number(process.env.UI_SHARD_COUNT);
          const shards = JSON.parse(fs.readFileSync("ui-shards.json", "utf8"));
          const ordered = matrix.every((value, index) => value === index);
          if (matrix.length !== count || shards.length !== count || !ordered) {
            throw new Error(`UI shard count mismatch: ui-tests matrix [${matrix.join(", ")}], UI_SHARD_COUNT ${count}, ui-shards.json ${shards.length}`);
          }
          console.log(`UI shard count consistent: ${count}`);
          JS
      - name: Generate Xcode project
        run: |
          # Official universal binary; pin both the version and release asset digest.
          # https://github.com/yonaskolb/XcodeGen/releases/tag/2.46.0
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen-release"
          "$RUNNER_TEMP/xcodegen-release/xcodegen/bin/xcodegen" --version
          "$RUNNER_TEMP/xcodegen-release/xcodegen/bin/xcodegen" generate
      - name: Build once for all test jobs
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES || true
          xcodebuild -project KakeiMatch.xcodeproj -scheme KakeiMatch -configuration Debug \
            -destination "$DESTINATION" -derivedDataPath DerivedData \
            -resultBundlePath Build.xcresult build-for-testing \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO IgnoreFileSystemDeviceInodeChanges=YES
      - name: Package test products preserving permissions and symlinks
        run: tar -czf test-products.tar.gz -C DerivedData/Build Products
      - uses: actions/upload-artifact@v4
        with:
          # UI jobs download this across attempts, so the name must stay stable.
          # A full re-run of the build job replaces the products instead of
          # failing on the duplicate name.
          name: ios-test-products
          overwrite: true
          path: |
            apps/ios/test-products.tar.gz
            apps/ios/ui-shards.json
          compression-level: 0
          retention-days: 1
      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # A retry gets a new attempt number, keeping the failed attempt's evidence.
          name: ios-build-results-attempt-${{ github.run_attempt }}
          path: apps/ios/Build.xcresult
          if-no-files-found: warn
          retention-days: 14
      # Index.noindex is large and unused by xcodebuild; remove it before saving.
      # Save only on pushes to main so PR runs reuse main's warm cache without growing
      # total repository cache usage. Reuse the primary key computed during restore so
      # untracked build outputs cannot shift the save key away from the restore key.
      - name: Remove DerivedData Index before caching
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deriveddata-cache.outputs.cache-primary-key != '' && steps.deriveddata-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: rm -rf DerivedData/Index.noindex
      - name: Save DerivedData cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deriveddata-cache.outputs.cache-primary-key != '' && steps.deriveddata-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: apps/ios/DerivedData
          key: ${{ steps.deriveddata-cache.outputs.cache-primary-key }}

  # Shard 0 also runs the Swift Testing unit tests on its simulator. A separate job
  # waited for another macOS runner and booted another simulator for about two minutes of tests.
  # Shards start with build rather than after it, so each simulator boots while build compiles.
  # The shard list is fixed to UI_SHARD_COUNT; build fails if the matrix, UI_SHARD_COUNT and ui-shards.json disagree.
  ui-tests:
    if: ${{ !github.event.pull_request.draft }}
    needs: build
    runs-on: macos-26
    # The wait for build counts toward this limit. In run 45810505033 the build job was queued
    # for about 24 minutes and then ran for about 8 minutes. Test steps keep their own limits
    # (Swift Testing 10, XCUITest 26), so this limit covers the wait plus those steps.
    timeout-minutes: 75
    # Job permissions replace the workflow's, so contents: read is repeated.
    # actions: read is only for listing this run's artifacts while waiting for build.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      # Spotlight indexing (mds/mdworker) competes with the build and simulator
      # for CPU on the hosted runner. Nothing in this workflow searches with
      # Spotlight. Failure is tolerated but reported as a warning.
      - name: Disable Spotlight indexing
        continue-on-error: true
        run: |
          echo "::group::Spotlight state before"
          mdutil -s -a || true
          echo "::endgroup::"
          if ! sudo mdutil -a -i off; then
            echo "::warning::sudo mdutil -a -i off failed; Spotlight indexing may still be running"
          fi
          echo "::group::Spotlight state after"
          mdutil -s -a || true
          echo "::endgroup::"
          if mdutil -s / 2>&1 | grep -q "Indexing enabled"; then
            echo "::warning::Spotlight indexing is still enabled on /"
          fi
      # The first CoreSimulator call in a job is slow on these images
      # (actions/runner-images#15247). The start step below makes that call, so time
      # two calls here first. Failure is tolerated; this only records durations.
      - name: Time first simctl calls
        continue-on-error: true
        run: |
          printf '### First simctl calls\n' >> "$GITHUB_STEP_SUMMARY" || true
          for call in 1 2; do
            printf -- '- simctl list %s started (UTC): %s\n' "$call" "$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY" || true
            xcrun simctl list > /dev/null 2>&1 || true
            printf -- '- simctl list %s finished (UTC): %s\n' "$call" "$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY" || true
          done
      - name: Select Xcode and start simulator in background
        run: bash scripts/ci-simulator.sh start
      # build uploads ios-test-products after its swift test and build-for-testing pass.
      # Wait while build is queued or running; the job timeout is the outer limit.
      # Fail at once if build ends without the upload, or if the upload is still missing
      # 300 seconds after build succeeded. A failed API call is retried, so one transient
      # error does not end the wait.
      - name: Wait for build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each call has a 60-second limit; a failed or timed-out call is retried up to 5 times.
          api() {
            local attempt output
            for attempt in 1 2 3 4 5; do
              if output=$(perl -e 'alarm 60; exec @ARGV' gh api "$@"); then
                printf '%s\n' "$output"
                return 0
              fi
              echo "::warning::gh api failed (attempt $attempt of 5): $1" >&2
              sleep 10
            done
            return 1
          }
          started=$(date +%s)
          build_completed_at=""
          last_build_status=""
          while :; do
            build=$(api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.name == "build") | [.status, (.conclusion // "")] | @tsv')
            build_status=${build%%$'\t'*}
            build_conclusion=${build#*$'\t'}
            if [ "$build_status" != "$last_build_status" ]; then
              echo "build job: ${build_status:-not listed} ${build_conclusion}"
              last_build_status=$build_status
            fi
            artifacts=$(api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=ios-test-products" \
              --jq '[.artifacts[] | select(.expired | not)] | length')
            if [ "$artifacts" -gt 0 ]; then
              break
            fi
            if [ "$build_status" = completed ]; then
              if [ "$build_conclusion" != success ]; then
                echo "::error::build concluded '$build_conclusion' without ios-test-products"
                exit 1
              fi
              build_completed_at=${build_completed_at:-$(date +%s)}
              if [ $(( $(date +%s) - build_completed_at )) -ge 300 ]; then
                echo "::error::build succeeded but ios-test-products did not appear within 300 seconds"
                exit 1
              fi
            fi
            sleep 15
          done
          printf -- '- Waited for build artifacts: %s seconds (ended UTC: %s)\n' \
            "$(( $(date +%s) - started ))" "$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/download-artifact@v4
        with:
          name: ios-test-products
          path: apps/ios
      - name: Unpack test products and select shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mkdir -p DerivedData/Build
          tar -xzf test-products.tar.gz -C DerivedData/Build
          node -e 'const shards = JSON.parse(require("node:fs").readFileSync("ui-shards.json", "utf8")); if (shards.length !== Number(process.env.UI_SHARD_COUNT)) throw new Error(`ui-shards.json has ${shards.length} shards, expected ${process.env.UI_SHARD_COUNT}`); console.log(shards[Number(process.env.SHARD_INDEX)].tests.join("\n"))' > shard-tests.txt
          cat shard-tests.txt
      - name: Wait for simulator and set reference appearance
        run: bash scripts/ci-simulator.sh wait
      - name: Prepare test startup monitoring
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/observe-ios-test.sh" <<'BASH'
          # Invoked by each test step so its summary belongs to that step.
          observe_ios_test() (
            local label="$1" state
            shift
            state="$RUNNER_TEMP/ios-startup/$label"
            if ! command -v perl > /dev/null || ! mkdir -p "$state"; then
              "$@"
              return
            fi
            date +%s > "$state/start" || true
            printf '### %s startup\n- xcodebuild started (UTC): %s\n' \
              "$label" "$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY" || true

            (
              sleep 181 > /dev/null 2>&1
              for sample in 1 2 3 4; do
                [ ! -s "$state/test-start" ] || break
                printf 'Startup CPU sample %s at %s\n' "$sample" "$(date -u +%FT%TZ)"
                ps -axo pid,pcpu,comm -r | awk 'NR <= 16' || true
                [ "$sample" = 4 ] || sleep 60 > /dev/null 2>&1
              done
            ) &
            monitor_pid=$!
            trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT

            # Match the first observed XCTest or Swift Testing start line.
            # Drain all output and preserve xcodebuild's exit status.
            local result=0
            "$@" 2>&1 | perl -MPOSIX=strftime -e '
              $| = 1;
              my ($state, $summary) = @ARGV;
              my $started = 0;
              while (<STDIN>) {
                print;
                if (!$started && /^(?:Test Suite .* started at |(?:◇ )?Test run started\b)/) {
                  $started = 1;
                  my $now = time;
                  if (open my $marker, ">", "$state/test-start") {
                    print {$marker} "$now\n";
                  }
                  if (open my $out, ">>", $summary) {
                    print {$out} "- Test execution started (UTC): ",
                      strftime("%Y-%m-%dT%H:%M:%SZ", gmtime($now)), "\n";
                  }
                }
              }
            ' "$state" "$GITHUB_STEP_SUMMARY" || result=${PIPESTATUS[0]}
            date +%s > "$state/end" || true
            return "$result"
          )
          BASH
      - name: Swift Testing
        id: unit-tests
        timeout-minutes: 10
        if: matrix.shard == 0
        run: |
          xctestruns=(DerivedData/Build/Products/*.xctestrun)
          test "${#xctestruns[@]}" -eq 1
          if ! source "$RUNNER_TEMP/observe-ios-test.sh"; then
            observe_ios_test() { shift; "$@"; }
          fi
          observe_ios_test swift-testing xcodebuild -xctestrun "${xctestruns[0]}" -destination "$DESTINATION" \
            -resultBundlePath UnitTests.xcresult -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            -only-testing:KakeiMatchTests test-without-building
      - name: Generate parity report
        if: always() && matrix.shard == 0
        run: |
          xcrun xcresulttool export attachments --path UnitTests.xcresult --output-path parity-attachments
          node --test scripts/collect-parity-report.test.mjs
          node scripts/collect-parity-report.mjs parity-attachments parity-report.json
      - name: Upload parity report
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-attempt-${{ github.run_attempt }}
          path: apps/ios/parity-report.json
          if-no-files-found: warn
          retention-days: 14
      # Still run the UI tests when only the unit tests failed, so one run reports both.
      - name: XCUITest and screenshots
        timeout-minutes: 26
        if: success() || steps.unit-tests.outcome == 'failure'
        run: |
          test_args=()
          while IFS= read -r test_name; do
            # An empty shard file holds one blank line; it names no test.
            [ -n "$test_name" ] || continue
            test_args+=("-only-testing:KakeiMatchUITests/$test_name")
          done < shard-tests.txt
          # A short selection can leave this shard without tests. That is a pass, not a skip.
          if [ "${#test_args[@]}" -eq 0 ]; then
            echo "No UI tests in this shard; nothing to run."
            exit 0
          fi
          xctestruns=(DerivedData/Build/Products/*.xctestrun)
          test "${#xctestruns[@]}" -eq 1
          if ! source "$RUNNER_TEMP/observe-ios-test.sh"; then
            observe_ios_test() { shift; "$@"; }
          fi
          observe_ios_test xcuitest xcodebuild -xctestrun "${xctestruns[0]}" -destination "$DESTINATION" \
            -resultBundlePath UITests.xcresult -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            "${test_args[@]}" test-without-building
      - name: Export screenshots
        if: always()
        run: |
          if [ -d UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path UITests.xcresult --output-path screenshots
          fi
      # A passing pull request shard skips these diagnostic uploads. They run after every
      # test step, so job.status is final here and a failure in any step keeps them.
      - name: Upload unit test results
        if: always() && matrix.shard == 0 && !(github.event_name == 'pull_request' && job.status == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-attempt-${{ github.run_attempt }}
          path: apps/ios/UnitTests.xcresult
          if-no-files-found: warn
          retention-days: 14
      - name: Upload UI test results
        if: always() && !(github.event_name == 'pull_request' && job.status == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            apps/ios/UITests.xcresult
            apps/ios/shard-tests.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload reference screenshots
        if: always() && !(github.event_name == 'pull_request' && job.status == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: ios-reference-screenshots-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            apps/ios/screenshots/*.png
            apps/ios/screenshots/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Collect slow test startup logs
        id: startup-logs
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          for state in "$RUNNER_TEMP"/ios-startup/*; do
            [[ -s "$state/start" ]] || continue
            read -r start < "$state/start"
            end=$(cat "$state/test-start" 2>/dev/null || cat "$state/end" 2>/dev/null || date +%s)
            (( end - start > 180 )) || continue

            from=$(date -u -r "$start" '+%Y-%m-%d %H:%M:%S')
            until=$(date -u -r "$end" '+%Y-%m-%d %H:%M:%S')
            output="$RUNNER_TEMP/ios-startup-logs/${state##*/}"
            mkdir -p "$output"
            echo 'available=true' >> "$GITHUB_OUTPUT"
            printf 'Startup interval (UTC): %s to %s (%ss)\n' "$from" "$until" "$((end - start))" > "$output/interval.txt"
            options=(--start "$from" --end "$until" --timezone UTC --info)
            # Bound each query independently so a stuck simulator cannot block the host query.
            perl -e 'alarm 12; exec @ARGV' xcrun simctl spawn "$SIMULATOR_ID" log show "${options[@]}" \
              --predicate 'process IN {"installd", "testmanagerd", "launchd", "xctest"} OR subsystem CONTAINS[c] "xctest"' \
              > "$output/simulator.log" 2>&1 &
            simulator_log_pid=$!
            perl -e 'alarm 12; exec @ARGV' /usr/bin/log show "${options[@]}" \
              --predicate 'subsystem BEGINSWITH "com.apple.CoreSimulator" OR process == "CoreSimulatorService" OR process == "Simulator"' \
              > "$output/host.log" 2>&1 || true
            wait "$simulator_log_pid" || true
          done
      # Kept on every run: these logs exist only when startup took over 180 seconds,
      # and a passing run is where that slowness would otherwise leave no evidence.
      - name: Upload slow test startup logs
        if: always() && steps.startup-logs.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: ios-startup-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-startup-logs
          if-no-files-found: ignore
          retention-days: 14

  # Pull request tests run Debug only; verify Release compilation on main pushes and manual runs before TestFlight.
  release-build:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: bash scripts/ci-simulator.sh select
      - name: Generate Xcode project
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen-release"
          "$RUNNER_TEMP/xcodegen-release/xcodegen/bin/xcodegen" generate
      - name: Build Release for devices without signing
        run: |
          xcodebuild -project KakeiMatch.xcodeproj -scheme KakeiMatch -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO

  ios:
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [build, ui-tests, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Require every executed iOS job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          jq -e 'length > 0 and all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS_JSON"
      # Pull requests skip screenshot-only tests, so the combined set would be partial.
      - if: github.event_name != 'pull_request' && needs.ui-tests.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: ios-reference-screenshots-shard-*-attempt-*
          path: screenshot-shards
      - name: Combine screenshots for existing download commands
        if: github.event_name != 'pull_request' && needs.ui-tests.result == 'success'
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path('screenshot-shards')
          prefix = 'ios-reference-screenshots-shard-'
          by_shard = {}
          for path in root.iterdir():
              if not path.name.startswith(prefix):
                  continue
              shard_text, separator, attempt_text = path.name[len(prefix):].partition('-attempt-')
              if separator != '-attempt-' or not shard_text.isdigit() or not attempt_text.isdigit():
                  continue
              shard, attempt = int(shard_text), int(attempt_text)
              if shard not in by_shard or attempt > by_shard[shard][0]:
                  by_shard[shard] = (attempt, path)
          count = int(os.environ['UI_SHARD_COUNT'])
          assert sorted(by_shard) == list(range(count)), f'Missing screenshot shard: {sorted(by_shard)}'
          shards = [by_shard[index][1] for index in range(count)]
          output = pathlib.Path('screenshots')
          output.mkdir()
          manifest = []
          for shard in shards:
              entries = json.loads((shard / 'manifest.json').read_text())
              assert isinstance(entries, list), 'Expected an attachment manifest array'
              manifest.extend(entries)
              for source in shard.glob('*.png'):
                  target = output / source.name
                  assert not target.exists(), f'Duplicate screenshot: {source.name}'
                  shutil.copyfile(source, target)
          (output / 'manifest.json').write_text(json.dumps(manifest))
          PY
      - name: Build PWA visual regression report
        if: github.event_name != 'pull_request' && needs.ui-tests.result == 'success'
        run: |
          node apps/ios/scripts/visual-regression.mjs \
            --ios screenshots \
            --reference docs/screenshots/migration \
            --output visual-regression
      - if: github.event_name != 'pull_request' && needs.ui-tests.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-visual-regression-attempt-${{ github.run_attempt }}
          path: visual-regression
          if-no-files-found: error
          retention-days: 14
      - if: github.event_name != 'pull_request' && needs.ui-tests.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-reference-screenshots-attempt-${{ github.run_attempt }}
          path: screenshots
          if-no-files-found: error
          retention-days: 14
