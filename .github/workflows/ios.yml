name: iOS

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'test/fixtures/ios-parity/**'
      - '.github/workflows/ios.yml'
  # Screenshot-only UI tests run here, not on every pull request.
  # Run the workflow manually on a branch to get its reference screenshots.
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'test/fixtures/ios-parity/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  UI_SHARD_COUNT: 4
  UI_SHARD_FLAGS: ${{ github.event_name == 'pull_request' && '--skip-screenshots' || '' }}

defaults:
  run:
    working-directory: apps/ios
    shell: bash

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # Official image inventory: Xcode_26.2.app, iOS 26.2, iPhone 17.
      # https://github.com/actions/runner-images/blob/71a003a8ee93ec4165885a365ab607c6732c5078/images/macos/macos-15-Readme.md
      # build-for-testing only needs the destination, not a booted device.
      # Booting here competes with the compiler for the runner's CPUs.
      - name: Select Xcode and simulator destination
        run: bash scripts/ci-simulator.sh select
      - name: Run macOS core tests without a simulator
        run: swift test --package-path .
      - name: Validate UI shard coverage
        id: shards
        run: |
          node --test scripts/shard-ui-tests.test.mjs
          node scripts/shard-ui-tests.mjs "$UI_SHARD_COUNT" ${UI_SHARD_FLAGS:+"$UI_SHARD_FLAGS"} > ui-shards.json
          cat ui-shards.json
          node -e 'const fs = require("node:fs"); const shards = JSON.parse(fs.readFileSync("ui-shards.json", "utf8")); console.log("matrix=" + JSON.stringify(shards.map((_, index) => index)))' >> "$GITHUB_OUTPUT"
      - name: Generate Xcode project
        run: |
          # Official universal binary; pin both the version and release asset digest.
          # https://github.com/yonaskolb/XcodeGen/releases/tag/2.46.0
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen-release"
          "$RUNNER_TEMP/xcodegen-release/xcodegen/bin/xcodegen" --version
          "$RUNNER_TEMP/xcodegen-release/xcodegen/bin/xcodegen" generate
      - name: Build once for all test jobs
        run: |
          xcodebuild -project KakeiMatch.xcodeproj -scheme KakeiMatch -configuration Debug \
            -destination "$DESTINATION" -derivedDataPath DerivedData \
            -resultBundlePath Build.xcresult build-for-testing CODE_SIGNING_ALLOWED=NO
      - name: Package test products preserving permissions and symlinks
        run: tar -czf test-products.tar.gz -C DerivedData/Build Products
      - uses: actions/upload-artifact@v4
        with:
          name: ios-test-products
          path: apps/ios/test-products.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-results
          path: apps/ios/Build.xcresult
          if-no-files-found: warn
          retention-days: 14

  swift-testing:
    needs: build
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and start simulator in background
        run: bash scripts/ci-simulator.sh start
      - uses: actions/download-artifact@v4
        with:
          name: ios-test-products
          path: apps/ios
      - name: Unpack test products
        run: |
          mkdir -p DerivedData/Build
          tar -xzf test-products.tar.gz -C DerivedData/Build
      - name: Wait for simulator and set reference appearance
        run: bash scripts/ci-simulator.sh wait
      - name: Swift Testing
        run: |
          xctestruns=(DerivedData/Build/Products/*.xctestrun)
          test "${#xctestruns[@]}" -eq 1
          xcodebuild -xctestrun "${xctestruns[0]}" -destination "$DESTINATION" \
            -resultBundlePath UnitTests.xcresult -parallel-testing-enabled NO \
            -only-testing:KakeiMatchTests test-without-building
      - name: Generate parity report
        if: always()
        run: |
          xcrun xcresulttool export attachments --path UnitTests.xcresult --output-path parity-attachments
          node --test scripts/collect-parity-report.test.mjs
          node scripts/collect-parity-report.mjs parity-attachments parity-report.json
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: apps/ios/parity-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: apps/ios/UnitTests.xcresult
          if-no-files-found: warn
          retention-days: 14

  ui-tests:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and start simulator in background
        run: bash scripts/ci-simulator.sh start
      - uses: actions/download-artifact@v4
        with:
          name: ios-test-products
          path: apps/ios
      - name: Unpack test products and select shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mkdir -p DerivedData/Build
          tar -xzf test-products.tar.gz -C DerivedData/Build
          node scripts/shard-ui-tests.mjs "$UI_SHARD_COUNT" "$SHARD_INDEX" ${UI_SHARD_FLAGS:+"$UI_SHARD_FLAGS"} > shard-tests.txt
          cat shard-tests.txt
      - name: Wait for simulator and set reference appearance
        run: bash scripts/ci-simulator.sh wait
      - name: XCUITest and screenshots
        run: |
          test_args=()
          while IFS= read -r test_name; do
            test_args+=("-only-testing:KakeiMatchUITests/$test_name")
          done < shard-tests.txt
          test "${#test_args[@]}" -gt 0
          xctestruns=(DerivedData/Build/Products/*.xctestrun)
          test "${#xctestruns[@]}" -eq 1
          xcodebuild -xctestrun "${xctestruns[0]}" -destination "$DESTINATION" \
            -resultBundlePath UITests.xcresult -parallel-testing-enabled NO \
            "${test_args[@]}" test-without-building
      - name: Export screenshots
        if: always()
        run: |
          if [ -d UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path UITests.xcresult --output-path screenshots
          fi
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-shard-${{ matrix.shard }}
          path: |
            apps/ios/UITests.xcresult
            apps/ios/shard-tests.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reference-screenshots-shard-${{ matrix.shard }}
          path: |
            apps/ios/screenshots/*.png
            apps/ios/screenshots/manifest.json
          if-no-files-found: warn
          retention-days: 14

  ios:
    if: always()
    needs: [build, swift-testing, ui-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every iOS job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
      # Pull requests skip screenshot-only tests, so the combined set would be partial.
      - if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          pattern: ios-reference-screenshots-shard-*
          path: screenshot-shards
      - name: Combine screenshots for existing download commands
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          shards = sorted(pathlib.Path('screenshot-shards').iterdir())
          assert len(shards) == int(os.environ['UI_SHARD_COUNT']), 'Missing screenshot shard'
          output = pathlib.Path('screenshots')
          output.mkdir()
          manifest = []
          for shard in shards:
              entries = json.loads((shard / 'manifest.json').read_text())
              assert isinstance(entries, list), 'Expected an attachment manifest array'
              manifest.extend(entries)
              for source in shard.glob('*.png'):
                  target = output / source.name
                  assert not target.exists(), f'Duplicate screenshot: {source.name}'
                  shutil.copyfile(source, target)
          (output / 'manifest.json').write_text(json.dumps(manifest))
          PY
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ios-reference-screenshots
          path: screenshots
          if-no-files-found: error
          retention-days: 14
