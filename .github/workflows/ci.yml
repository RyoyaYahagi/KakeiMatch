name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No Docker service, Actual Server, household SQLite, or legacy secret is provisioned.
# Legacy integration tests create temporary synthetic fixtures only.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/actual-browser/package-lock.json
      - run: npm ci --prefix spikes/actual-browser
      - run: npm run build --prefix spikes/actual-browser

  local-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:reconciliation
      - run: pnpm --dir apps/pwa typecheck
      - run: pnpm --dir apps/pwa test
      - run: pnpm --dir apps/pwa build
      - run: pnpm --dir apps/pwa exec playwright-core install --with-deps chromium
      - name: Synthetic local-first flows without legacy runtime
        run: |
          unset ACTUAL_SERVER_URL ACTUAL_SERVER_PASSWORD ACTUAL_CLI_DATA_DIR
          unset RECEIPT_STORAGE_DIR STATEMENT_STORAGE_DIR DATABASE_PATH
          pnpm --dir apps/pwa exec vite preview --host 127.0.0.1 --port 5173 > /tmp/kakeimatch-pwa-dev.log 2>&1 &
          pwa_pid=$!
          trap 'kill "$pwa_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:e2e
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:backup-e2e
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:masters-e2e
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:receipt-items-e2e
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:manual-e2e
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:transfers-e2e
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:receipt-edits-e2e
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:deletions-e2e
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:monthly-dashboard-e2e
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:account-balances-e2e
          PWA_E2E_URL=http://127.0.0.1:5173 pnpm --dir apps/pwa test:monthly-budgets-e2e
      - run: npm ci --prefix workers/ai-gateway
      - run: npm test --prefix workers/ai-gateway
      - run: npm run typecheck --prefix workers/ai-gateway
      - run: npm run build --prefix workers/ai-gateway
