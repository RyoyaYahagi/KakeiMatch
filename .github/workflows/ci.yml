name: CI

# Private-repository minutes are billed per job and rounded up to whole minutes,
# so checks share one job instead of fanning out into many short jobs.
# Every PR returns the required ci check; Workers Builds deploys main after merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue runs the required ci check on the queued merge group.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No Docker service, Actual Server, household SQLite, or legacy secret is provisioned.
# Legacy integration tests create temporary synthetic fixtures only.
jobs:
  ci:
    if: ${{ !github.event.pull_request.draft }}
    # The repository variable CI_RUNNER=self-hosted runs CI on the always-on host
    # without billed minutes; when it is unset, GitHub-hosted runners are used.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # Playwright has no Ubuntu 26.04 build yet; the 24.04 Chromium runs on the host.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test CI selection rules
        run: node --test scripts/select-ci-tests.test.mjs
      - name: Select checks from changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/select-ci-tests.mjs
      # iOS-only changes never install dependencies, so there is no store to save.
      - name: Restore pnpm cache for root checks
        if: steps.changes.outputs.skip_root != 'true' && runner.environment == 'github-hosted'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate TestFlight upload script
        run: |
          bash -n apps/ios/scripts/testflight.sh
          node --test scripts/testflight.test.mjs
      # Dependency-free, so it runs before the dependency install and on iOS-only PRs too.
      - name: Test the read-only snapshot CLI
        run: node --test 'tools/kakeimatch-read/*.test.mjs'
      - if: steps.changes.outputs.skip_root != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.skip_root != 'true'
        run: pnpm lint
      - if: steps.changes.outputs.skip_root != 'true'
        run: pnpm typecheck
      - if: steps.changes.outputs.skip_root != 'true'
        run: pnpm test
      - if: steps.changes.outputs.skip_root != 'true'
        run: pnpm eval:reconciliation
      - name: Run reconciliation property evaluation
        if: steps.changes.outputs.skip_root != 'true'
        run: pnpm eval:reconciliation-property
      - name: Build the AI Gateway for the admin browser test
        if: steps.changes.outputs.skip_root != 'true'
        run: |
          npm ci --prefix workers/ai-gateway
          npm run build --prefix workers/ai-gateway
      - name: Install Chromium
        if: steps.changes.outputs.skip_root != 'true'
        run: npm exec --prefix workers/ai-gateway -- playwright-core install chromium
      - name: Test the admin screen with synthetic data
        if: steps.changes.outputs.skip_root != 'true'
        working-directory: workers/ai-gateway
        env:
          ADMIN_E2E_URL: http://127.0.0.1:5199
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 5199 --strictPort > "$RUNNER_TEMP/kakeimatch-gateway.log" 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 "$ADMIN_E2E_URL/api/native/config" > /dev/null
          timeout --signal=TERM --kill-after=10s 240s node test/admin-e2e.mjs
      - name: Upload Gateway preview logs
        if: failure() && steps.changes.outputs.skip_root != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gateway-preview-log
          path: ${{ runner.temp }}/kakeimatch-gateway.log
          if-no-files-found: ignore
          retention-days: 7
